<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163d32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="利他・自利日記"><link rel="manifest" href="manifest.webmanifest"><title>利他・自利 日記</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#21372f;background:#f6f8f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:20px 16px 90px}header{background:#163d32;color:white;padding:28px 20px;border-radius:0 0 24px 24px}header small{opacity:.75}h1{margin:5px 0;font-size:27px}h2{font-size:18px;margin:0 0 14px}.card{background:white;border:1px solid #e0e7e0;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 2px 10px #143c2a09}.muted{color:#6b7b73;font-size:13px}label{display:block;font-weight:650;margin:13px 0 7px}input,textarea,select{width:100%;border:1px solid #cbd7ce;border-radius:11px;padding:12px;font:inherit;background:#fff;color:#1b3329}textarea{min-height:75px;resize:vertical}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices label{margin:0;font-weight:500;border:1px solid #cbd7ce;border-radius:11px;padding:11px 8px;text-align:center;cursor:pointer}.choices input{position:absolute;opacity:0;width:0}.choices label:has(input:checked){background:#e2f2e8;border-color:#267956;color:#135538;font-weight:700}button{border:0;background:#1c7050;color:white;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e8eee9;color:#23533d}button.danger{background:#f9e9e7;color:#9b332b}.flex{display:flex;gap:8px;align-items:center;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#edf4ef;border-radius:12px;text-align:center;padding:12px 4px}.stat strong{display:block;font-size:25px;color:#1b6c4a}.stat span{font-size:11px}.entry{padding:13px 0;border-top:1px solid #e7ece7}.entry p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.pill{font-size:12px;color:#256346;background:#e6f3ea;border-radius:99px;padding:4px 9px}.actions{display:flex;gap:6px}.actions button{padding:7px 10px;font-size:12px}.bar{height:10px;border-radius:99px;background:#e5ece7;overflow:hidden}.bar div{height:100%;background:#3c9c70}.note{font-size:12px;line-height:1.7;color:#6b7b73}footer{margin-top:18px;text-align:center}.hidden{display:none!important}</style></head><body>
<header><div class="wrap" style="padding:0"><small>MY DAILY PRACTICE</small><h1>🌱 利他・自利 日記</h1><small>動機と結果から、日々の循環を見つける</small></div></header><main class="wrap">
<section class="card"><label for="date">記録する日付</label><input type="date" id="date"><div class="stats" style="margin-top:14px"><div class="stat"><strong id="count">0</strong><span>記録件数</span></div><div class="stat"><strong id="intentCount">0</strong><span>利他が動機</span></div><div class="stat"><strong id="rate">0%</strong><span>利他を含む結果</span></div></div><div class="bar" style="margin-top:12px"><div id="bar" style="width:0%"></div></div><p class="note">利他率は記録した行動のうち、結果に利他を含む割合。人格の点数ではありません。</p></section>
<section class="card"><h2 id="formTitle">今日の行動を記録</h2><form id="form"><label for="action">① 何をした？</label><textarea id="action" required maxlength="1000" placeholder="例：友人の話を聞いて一緒に笑った"></textarea><label>② きっかけ・動機</label><div class="choices" id="motives"><label><input type="radio" name="motive" value="利他">利他</label><label><input type="radio" name="motive" value="自利" checked>自利</label><label><input type="radio" name="motive" value="自愛">自愛・回復</label><label><input type="radio" name="motive" value="両方">自利＋利他</label></div><label>③ 結果は？</label><div class="choices"><label><input type="radio" name="result" value="利他">利他</label><label><input type="radio" name="result" value="自利">自利</label><label><input type="radio" name="result" value="両方" checked>自利＋利他</label><label><input type="radio" name="result" value="不明">まだ不明</label></div><div class="flex" style="margin-top:16px"><button type="submit" id="submit">＋ 記録する</button><button type="button" id="cancel" class="secondary hidden">編集をやめる</button></div></form></section>
<section class="card"><h2>今日の気づき</h2><textarea id="reflection" placeholder="今日感じたこと、気づいた循環など"></textarea><p class="muted">入力後に自動保存されます。</p></section>
<section class="card"><div class="flex"><h2>観察ログ</h2><select id="filter" style="width:auto"><option value="day">選択日</option><option value="all">全件</option></select></div><div id="entries"></div></section>
<section class="card"><h2>データのバックアップ</h2><p class="note">記録はこのiPhoneのブラウザ内に保存されます。端末故障・サイトデータ削除などに備え、定期的にバックアップを「ファイル」に保存してください。別端末とは自動同期しません。</p><div class="flex" style="flex-wrap:wrap;justify-content:flex-start"><button id="export" class="secondary">バックアップを保存</button><button id="importBtn" class="secondary">バックアップを復元</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div></section><footer class="note">利他と自利は対立ではなく、観察のための目印。</footer></main>
<script>
(()=>{'use strict';const KEY='rita-jiri-diary-v1';const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let data={records:[],reflections:{}},editing=null;try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(Array.isArray(v.records)&&v.reflections&&typeof v.reflections==='object')data=v}}catch(e){alert('保存データを読み込めませんでした。復元用バックアップがあれば利用してください。')}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存に失敗しました。ストレージの空き容量やSafariの設定を確認してください。');return false}}function clean(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const day=$('date').value;const selected=data.records.filter(r=>r.day===day);const yes=selected.filter(r=>['利他','両方'].includes(r.result)).length;const pct=selected.length?Math.round(yes/selected.length*100):0;$('count').textContent=selected.length;$('intentCount').textContent=selected.filter(r=>r.motive==='利他').length;$('rate').textContent=pct+'%';$('bar').style.width=pct+'%';$('reflection').value=data.reflections[day]||'';const rows=($('filter').value==='all'?data.records:selected).slice().sort((a,b)=>b.day.localeCompare(a.day)||b.created-a.created);$('entries').innerHTML=rows.length?rows.map(r=>`<article class="entry"><div class="flex"><span class="muted">${clean(r.day)}</span><div class="actions"><button class="secondary" data-edit="${clean(r.id)}">編集</button><button class="danger" data-delete="${clean(r.id)}">削除</button></div></div><p>${clean(r.action)}</p><span class="pill">${clean(r.motive)} → ${clean(r.result==='両方'?'自利＋利他':r.result)}</span></article>`).join(''):'<p class="muted">まだ記録がありません。</p>'}function reset(){editing=null;$('form').reset();$('formTitle').textContent='今日の行動を記録';$('submit').textContent='＋ 記録する';$('cancel').classList.add('hidden')}function radio(name){return document.querySelector(`input[name="${name}"]:checked`).value}$('date').value=today();$('date').addEventListener('change',()=>{reset();render()});$('filter').addEventListener('change',render);$('reflection').addEventListener('input',()=>{data.reflections[$('date').value]=$('reflection').value;save()});$('form').addEventListener('submit',e=>{e.preventDefault();const action=$('action').value.trim();if(!action)return;const record={id:editing||('r'+Date.now()+Math.random().toString(36).slice(2)),day:$('date').value,action,motive:radio('motive'),result:radio('result'),created:Date.now()};if(editing){data.records=data.records.map(r=>r.id===editing?{...record,created:r.created}:r)}else data.records.push(record);if(save()){reset();render()}});$('cancel').addEventListener('click',reset);$('entries').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const r=data.records.find(x=>x.id===edit.dataset.edit);if(!r)return;editing=r.id;$('date').value=r.day;$('action').value=r.action;document.querySelector(`input[name="motive"][value="${r.motive}"]`).checked=true;document.querySelector(`input[name="result"][value="${r.result}"]`).checked=true;$('formTitle').textContent='記録を編集';$('submit').textContent='変更を保存';$('cancel').classList.remove('hidden');render();$('form').scrollIntoView({behavior:'smooth'})}if(del&&confirm('この記録を削除しますか？')){data.records=data.records.filter(r=>r.id!==del.dataset.delete);save();render()}});$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rita-jiri-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(!Array.isArray(v.records)||!v.reflections||typeof v.reflections!=='object'||v.records.some(r=>typeof r.id!=='string'||typeof r.day!=='string'||typeof r.action!=='string'||!['利他','自利','自愛','両方'].includes(r.motive)||!['利他','自利','両方','不明'].includes(r.result)))throw Error('形式が正しくありません');if(!confirm('現在の記録をバックアップの内容で置き換えます。続けますか？'))return;data={records:v.records,reflections:v.reflections};save();reset();render();alert('復元しました')}catch(err){alert('バックアップを読み込めませんでした：'+err.message)}finally{e.target.value=''}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
